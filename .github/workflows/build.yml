name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.3.3'
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: mace-mod-jar
          path: build/libs/*.jar
